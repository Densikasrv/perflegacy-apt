name: Deploy i386 APT Repo to Pages

on:
  push:
    branches:
      - main  # Если ваша ветка называется master, замените main на masterы

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install APT utilities
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg

      # Импорт приватного ключа. Опция --pinentry-mode loopback нужна, если у ключа есть пароль.
      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import --pinentry-mode loopback

      - name: Generate APT Repository
        run: |
          # Создаем структуру папок для архитектуры i386
          mkdir -p dists/stable/main/binary-i386
          
          # 1. Сканируем пакеты и создаем индексы Packages
          apt-ftparchive packages pool/main/ > dists/stable/main/binary-i386/Packages
          gzip -k -f dists/stable/main/binary-i386/Packages
          xz -k -f dists/stable/main/binary-i386/Packages
          
          # Создаем конфигурацию релиза, принудительно указывая только i386
          cat <<EOF > apt-release.conf
          APT::FTPArchive::Release::Origin "Perflegacy-apt Repo";
          APT::FTPArchive::Release::Label "Perflegacy-apt";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "i386";
          APT::FTPArchive::Release::Components "main";
          EOF

          # 2. Генерируем главный файл Release
          apt-ftparchive -c apt-release.conf release dists/stable/ > dists/stable/Release
          rm apt-release.conf
          
          # 3. Подписываем репозиторий. 
          # Если при создании ключа вы задавали пароль (passphrase), добавьте в команду ниже аргумент: --passphrase "${{ secrets.GPG_PASSPHRASE }}"
          gpg --batch --yes --pinentry-mode loopback --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback -abs -o dists/stable/Release.gpg dists/stable/Release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
